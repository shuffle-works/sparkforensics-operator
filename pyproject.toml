[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparkforensics-operator"
version = "0.1.1"
description = "Airflow operator that runs sparkforensics analysis on a Spark job's event log and acts on the result."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Agustin Recoba", email = "agustin.recoba@outlook.com" }]
keywords = ["airflow", "spark", "sparkforensics", "observability", "data-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Framework :: Apache Airflow",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "apache-airflow>=2.6",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/shuffle-works/sparkforensics-operator"
Repository = "https://github.com/shuffle-works/sparkforensics-operator"
Issues = "https://github.com/shuffle-works/sparkforensics-operator/issues"

[project.optional-dependencies]
s3 = ["apache-airflow-providers-amazon>=8.0"]
ssh = ["apache-airflow-providers-ssh>=5.0", "apache-airflow-providers-sftp>=4.0"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sparkforensics_operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
