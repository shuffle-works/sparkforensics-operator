[tox]
envlist = py{39,310,311,312}-airflow2, py{310,311,312}-airflow3, py39-airflow2min

[testenv]
usedevelop = true
extras = test,s3,ssh
deps =
    airflow2: apache-airflow>=2.6,<3.0
    airflow3: apache-airflow>=3.0,<4.0
commands = pytest --cov=sparkforensics_operator --cov-report=lcov:coverage-{envname}.lcov {posargs:tests}

# extras intentionally excludes ssh: apache-airflow-providers-ssh>=5.0
# requires apache-airflow>=2.11.0, incompatible with this env's exact
# apache-airflow==2.6.3 pin (see constraints-airflow-2.6-floor.txt below).
# The ssh extra's own effective floor is airflow>=2.11, higher than this
# package's overall airflow>=2.6 floor that this env exists to test.
[testenv:py39-airflow2min]
# Pins to the declared floor (pyproject's apache-airflow>=2.6) instead of
# letting pip resolve to the newest 2.x, so the floor actually gets
# exercised in CI. See constraints-airflow-2.6-floor.txt for why a plain
# `apache-airflow==2.6.*` pin isn't enough on its own: tox installs `deps`
# and this package's own `extras` as two separate pip invocations, and
# without a constraint shared across both, the `extras` step re-resolves
# the s3 provider package unconstrained, silently upgrading
# apache-airflow past the floor this job exists to test. `install_command`
# applies the same constraints file to every pip invocation tox makes for
# this env, closing that gap.
extras = test,s3
install_command = python -I -m pip install -c {toxinidir}/constraints-airflow-2.6-floor.txt {opts} {packages}
deps = apache-airflow==2.6.3
commands = pytest --cov=sparkforensics_operator --cov-report=lcov:coverage-{envname}.lcov {posargs:tests}
