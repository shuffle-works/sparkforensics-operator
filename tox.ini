[tox]
envlist = py{39,310,311,312}-airflow2, py{310,311,312}-airflow3, py39-airflow2min, py39-airflow2sshmin, py311-airflow2deferrablemin

[testenv]
usedevelop = true
extras = test,s3,ssh
deps =
    airflow2: apache-airflow>=2.6,<3.0
    airflow3: apache-airflow>=3.0,<4.0
commands = pytest --cov=sparkforensics_operator --cov-report=lcov:coverage-{envname}.lcov {posargs:tests}

# extras intentionally excludes ssh: this env checks that the package
# imports and works at its own floor without the ssh extra.
# py39-airflow2sshmin runs the same floor with it.
[testenv:py39-airflow2min]
# Pins to the declared floor (pyproject's apache-airflow>=2.6) instead of
# letting pip resolve to the newest 2.x, so the floor actually gets
# exercised in CI. See constraints-airflow-2.6-floor.txt for why a plain
# `apache-airflow==2.6.*` pin isn't enough on its own: tox installs `deps`
# and this package's own `extras` as two separate pip invocations, and
# without a constraint shared across both, the `extras` step re-resolves
# the s3 provider package unconstrained, silently upgrading
# apache-airflow past the floor this job exists to test. `install_command`
# applies the same constraints file to every pip invocation tox makes for
# this env, closing that gap.
extras = test,s3
install_command = python -I -m pip install -c {toxinidir}/constraints-airflow-2.6-floor.txt {opts} {packages}
deps = apache-airflow==2.6.3
# coverage-no-ssh.ini omits the modules that need the ssh extra this env
# leaves out, so its coverage measures only code it can run.
commands = pytest --cov=sparkforensics_operator --cov-config={toxinidir}/coverage-no-ssh.ini --cov-report=lcov:coverage-{envname}.lcov {posargs:tests}

# The ssh extra on the package's Airflow floor, with the providers Airflow
# 2.6.3's constraints pin (apache-airflow-providers-ssh 3.7.1, the extra's
# floor): the synchronous SSH backend and the SFTP/tunnel log sources run
# there; the deferrable mode's tests skip, since it needs a newer provider.
[testenv:py39-airflow2sshmin]
install_command = python -I -m pip install -c {toxinidir}/constraints-airflow-2.6-floor.txt {opts} {packages}
deps = apache-airflow==2.6.3

# The deferrable mode at its floors (apache-airflow-providers-ssh>=6.0.1 needs
# apache-airflow>=2.11.0). Same constraints-file approach as
# py39-airflow2min, for the same reason.
[testenv:py311-airflow2deferrablemin]
install_command = python -I -m pip install -c {toxinidir}/constraints-deferrable-floor.txt {opts} {packages}
deps = apache-airflow==2.11.0
