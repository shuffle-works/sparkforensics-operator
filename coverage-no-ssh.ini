# Coverage config for tox's py39-airflow2min env, which installs no ssh
# extra (see tox.ini): these modules only run with the SSH/SFTP providers
# installed, so there they would only ever count as uncovered. Every other
# env measures them.
[run]
omit =
    */sparkforensics_operator/hooks/analyze/ssh.py
    */sparkforensics_operator/hooks/analyze/_remote_job.py
    */sparkforensics_operator/hooks/log_source/sftp.py
    */sparkforensics_operator/hooks/log_source/tunnel.py
