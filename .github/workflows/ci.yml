name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            tox-env: py311-airflow2
          - python: "3.12"
            tox-env: py312-airflow2
          - python: "3.11"
            tox-env: py311-airflow3
          - python: "3.12"
            tox-env: py312-airflow3
          - python: "3.9"
            tox-env: py39-airflow2min
          - python: "3.9"
            tox-env: py39-airflow2sshmin
          - python: "3.11"
            tox-env: py311-airflow2deferrablemin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install tox
      - run: tox -e ${{ matrix.tox-env }}
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: ${{ matrix.tox-env }}
          path-to-lcov: coverage-${{ matrix.tox-env }}.lcov
          parallel: true

  # The rest of the suite simulates the CLI. This job runs the real one on
  # public corpus logs, so a change in its exit codes or flag rules fails
  # here. SPARKFORENSICS_REQUIRE_CLI turns a missing CLI or an unreachable
  # corpus into a failure instead of a skip.
  cli-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The release the operator is tested against (TESTED_CLI_VERSION in
        # report.py), and the newest one.
        cli: ["0.10.1", "latest"]
    env:
      SPARKFORENSICS_REQUIRE_CLI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g sparkforensics-cli@${{ matrix.cli }}
      - run: pip install tox
      - run: tox -e py312-airflow3 -- tests/integration -v

  finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
